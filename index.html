<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Unofficial editor for Pool of Radiance: Ruins of Myth Drannor saves and creature templates. Runs in the browser; files never leave your computer.">
  <title>Myth Drannor Editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23365a8c'/%3E%3Cpath d='M9 7h11l4 4v14H9z' fill='%23e8eef7'/%3E%3Cpath d='M12 14h9M12 18h9M12 22h6' stroke='%23365a8c' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/editor.css?v=1.0.1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Myth Drannor Editor</span>
    </div>
    <div class="actions">
      <button id="btn-open" class="btn" title="Open a .sav file together with its .sav.sta file">Open save</button>
      <button id="btn-folder" class="btn" title="Browse a savegames folder by save name; Chrome and Edge can also save straight back into it">Open folder</button>
      <button id="btn-game" class="btn" title="Use names, descriptions and maps from your installed game (any language) instead of the built-in English data">Load game folder</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="btn-redo" class="btn" title="Redo (Ctrl+Y)" disabled>Redo</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-save" class="btn primary" title="Check and write the edited save (Ctrl+S)" disabled>Download save</button>
      <button id="btn-download" class="btn" title="Download the edited files instead of writing into the folder" hidden disabled>Download copy</button>
    </div>
    <div class="status">
      <span id="dirty" class="dirty"></span>
      <span id="game-status" class="game-status"></span>
      <label class="enc" title="Code page of your game's language, used for all names and text. It is set from the game's text when you load the game folder or a .str file; choose another if names look wrong.">Text
        <select id="encoding">
          <option value="windows-1252">Western (1252)</option>
          <option value="windows-1250">Central European (1250)</option>
          <option value="windows-1251">Cyrillic (1251)</option>
          <option value="big5">Traditional Chinese (Big5)</option>
          <option value="gbk">Simplified Chinese (GBK)</option>
        </select>
      </label>
    </div>
  </header>
  <div class="layout">
    <nav id="nav" class="sidebar" aria-label="Sections"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <footer class="footer">
    <span>Unofficial fan tool, not approved by the game's developers. Files stay in this tab. Back up before editing.</span>
    <span id="fs-note"></span>
  </footer>
  <div id="datalists" hidden></div>
  <input id="file-input" type="file" accept=".sav,.sta" multiple hidden>
  <input id="sta-input" type="file" accept=".sta" hidden>
  <input id="folder-input" type="file" webkitdirectory hidden>
  <input id="game-input" type="file" webkitdirectory hidden>
  <input id="mon-input" type="file" accept=".mon,.str" multiple hidden>
  <input id="tee-input" type="file" accept=".trs,.str" multiple hidden>

  <script src="js/bytes.js?v=1.0.1"></script>
  <script src="js/tables.js?v=1.0.1"></script>
  <script src="js/savefile.js?v=1.0.1"></script>
  <script src="js/statefile.js?v=1.0.1"></script>
  <script src="js/scripts.js?v=1.0.1"></script>
  <script src="js/gamedata.js?v=1.0.1"></script>
  <script src="js/game-data.js?v=1.0.1"></script>
  <script src="js/model.js?v=1.0.1"></script>
  <script src="js/ui.js?v=1.0.1"></script>
  <script src="js/app.js?v=1.0.1"></script>
</body>
</html>
